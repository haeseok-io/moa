<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모아 이메일 로그인</title>
</head>

<body style="
    margin: 0;
    padding: 40px 20px;
    background-color: #f5f6fa;
    font-family: Arial, 'Malgun Gothic', sans-serif;
">

<table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td align="center">

            <!-- Container -->
            <table width="480" cellpadding="0" cellspacing="0" border="0"
                   style="
                       max-width: 480px;
                       width: 100%;
                       background-color: #ffffff;
                       border-radius: 16px;
                       overflow: hidden;
                   ">

                <!-- Content -->
                <tr>
                    <td style="padding: 56px 40px 48px; text-align: center;">

                        <!-- Logo -->
                        <div style="margin-bottom: 52px;">
                            <img
                                    src="cid:moa-logo"
                                    alt="모아"
                                    width="120"
                                    style="
                                    display: block;
                                    width: 120px;
                                    height: auto;
                                    margin: 0 auto;
                                    border: 0;
                                "
                            >
                        </div>

                        <!-- Title -->
                        <h1 style="
                            margin: 0 0 18px;
                            font-size: 30px;
                            line-height: 1.3;
                            font-weight: 700;
                            color: #111827;
                        ">
                            이메일 로그인
                        </h1>

                        <!-- Description -->
                        <p style="
                            margin: 0;
                            font-size: 16px;
                            line-height: 1.7;
                            color: #6b7280;
                        ">
                            모아에 로그인하려면<br>
                            아래 버튼을 눌러주세요.
                        </p>

                        <!-- Login Button -->
                        <table width="100%" cellpadding="0" cellspacing="0" border="0"
                               style="margin-top: 36px;">
                            <tr>
                                <td align="center">

                                    <a th:href="${loginUrl}"
                                       style="
                                           display: block;
                                           padding: 16px 20px;
                                           background-color: #5b4ff5;
                                           border-radius: 10px;
                                           color: #ffffff;
                                           font-size: 16px;
                                           font-weight: 700;
                                           line-height: 1.4;
                                           text-decoration: none;
                                       ">
                                        로그인하기&nbsp;&nbsp;→
                                    </a>

                                </td>
                            </tr>
                        </table>

                        <!-- Divider / Lock -->
                        <table width="100%" cellpadding="0" cellspacing="0" border="0"
                               style="margin-top: 42px;">
                            <tr>
                                <td width="42%" style="
                                    border-top: 1px solid #e5e7eb;
                                    font-size: 0;
                                ">
                                </td>

                                <td width="16%" align="center">
                                    <span style="
                                        display: inline-block;
                                        width: 40px;
                                        height: 40px;
                                        line-height: 40px;
                                        border-radius: 50%;
                                        background-color: #f0efff;
                                        color: #5b4ff5;
                                        font-size: 20px;
                                    ">
                                        🔒
                                    </span>
                                </td>

                                <td width="42%" style="
                                    border-top: 1px solid #e5e7eb;
                                    font-size: 0;
                                ">
                                </td>
                            </tr>
                        </table>

                        <!-- Notice -->
                        <p style="
                            margin: 26px 0 0;
                            font-size: 13px;
                            line-height: 1.8;
                            color: #9ca3af;
                        ">
                            이 로그인 링크는 <strong style="color: #6b7280;">10분</strong> 동안 유효합니다.<br>
                            본인이 요청하지 않은 경우 이 메일을 무시해주세요.
                        </p>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="
                        padding: 28px 20px;
                        text-align: center;
                        background-color: #fafaff;
                        border-top: 1px solid #f0f0f5;
                    ">

                        <img
                                src="cid:moa-logo"
                                alt="모아"
                                width="60"
                                style="
                                display: block;
                                width: 60px;
                                height: auto;
                                margin: 0 auto 10px;
                                border: 0;
                            "
                        >

                        <p style="
                            margin: 0;
                            font-size: 12px;
                            color: #a5a9bb;
                        ">
                            함께하는 더 나은 일상
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
